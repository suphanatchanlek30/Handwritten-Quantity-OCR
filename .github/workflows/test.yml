name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: core tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # OCR model wheels are installed only by platform setup scripts. Unit and
      # integration tests exercise the model-independent pipeline contracts.
      - name: Install core and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
