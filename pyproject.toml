[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qty-ocr"
version = "0.1.0"
description = "Handwritten quantity OCR for CHANGHOUSE order forms using PP-OCRv5_server_rec"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26",
    "opencv-contrib-python==4.10.0.84",
    "Pillow>=10",
    "PyYAML>=6",
]

[project.optional-dependencies]
ocr = ["paddleocr==3.7.0"]
dev = ["pytest>=8"]

[project.scripts]
qty-ocr = "qty_ocr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ocr: tests that load the real PP-OCRv5 model (slow)"]
